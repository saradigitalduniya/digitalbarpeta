<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#07110D" />
  <radialGradient id="appGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
    <stop offset="100%" stop-color="#050505" stop-opacity="0" />
  </radialGradient>
  <rect width="800" height="500" fill="url(#appGlow)" />
  
  <rect x="80" y="50" width="640" height="400" rx="16" fill="#0B1F17" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Smartphone Center Mockup -->
  <g transform="translate(290, 75)">
    <rect x="0" y="0" width="220" height="350" rx="30" fill="#0E1726" stroke="#10B981" stroke-width="3"/>
    <!-- Screen Notch -->
    <rect x="70" y="8" width="80" height="14" rx="7" fill="#050E0A"/>
    <circle cx="130" cy="15" r="3" fill="#10B981"/>
    
    <!-- App UI Header -->
    <text x="25" y="55" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Dispatch Dashboard</text>
    <circle cx="195" cy="50" r="10" fill="#10B981" fill-opacity="0.2"/>
    <circle cx="195" cy="50" r="4" fill="#22C55E"/>

    <!-- Interactive Cards on Phone -->
    <rect x="18" y="75" width="184" height="60" rx="10" fill="#182721" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
    <text x="30" y="98" font-family="sans-serif" font-size="10" fill="#A1A1AA">ACTIVE BOOKINGS</text>
    <text x="30" y="122" font-family="sans-serif" font-size="18" font-weight="900" fill="#22C55E">1,482</text>
    
    <!-- Mini Map Grid -->
    <rect x="18" y="145" width="184" height="120" rx="10" fill="#07110D" stroke="#1F2937" stroke-width="1"/>
    <circle cx="80" cy="190" r="8" fill="#38BDF8" fill-opacity="0.3"/>
    <circle cx="80" cy="190" r="4" fill="#38BDF8"/>
    <circle cx="130" cy="220" r="8" fill="#10B981" fill-opacity="0.3"/>
    <circle cx="130" cy="220" r="4" fill="#22C55E"/>
    <line x1="80" y1="190" x2="130" y2="220" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Bottom Nav -->
    <rect x="25" y="290" width="170" height="35" rx="17" fill="#182721"/>
    <circle cx="55" cy="307" r="5" fill="#10B981"/>
    <circle cx="110" cy="307" r="5" fill="#6B7280"/>
    <circle cx="165" cy="307" r="5" fill="#6B7280"/>
  </g>

  <!-- Left Stats Side Card -->
  <g transform="translate(110, 150)">
    <rect x="0" y="0" width="150" height="120" rx="12" fill="#182721" stroke="#38BDF8" stroke-width="1"/>
    <text x="16" y="32" font-family="sans-serif" font-size="10" fill="#A1A1AA">REALTIME SYNC</text>
    <text x="16" y="60" font-family="sans-serif" font-size="22" font-weight="900" fill="#38BDF8">&lt; 15ms</text>
    <text x="16" y="85" font-family="sans-serif" font-size="10" fill="#10B981">WebSocket Engine</text>
  </g>

  <!-- Right Side Card -->
  <g transform="translate(540, 150)">
    <rect x="0" y="0" width="150" height="120" rx="12" fill="#182721" stroke="#8B5CF6" stroke-width="1"/>
    <text x="16" y="32" font-family="sans-serif" font-size="10" fill="#A1A1AA">PLATFORMS</text>
    <text x="16" y="60" font-family="sans-serif" font-size="20" font-weight="900" fill="#C4B5FD">Android + Web</text>
    <text x="16" y="85" font-family="sans-serif" font-size="10" fill="#A1A1AA">Unified Codebase</text>
  </g>
</svg>
