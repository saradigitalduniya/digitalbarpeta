<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#07110D" />
  <radialGradient id="optGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
    <stop offset="100%" stop-color="#050505" stop-opacity="0" />
  </radialGradient>
  <rect width="800" height="500" fill="url(#optGlow)" />
  
  <rect x="80" y="50" width="640" height="400" rx="16" fill="#0B1F17" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Lighthouse 100 100 100 100 Perfect Scores -->
  <g transform="translate(140, 100)">
    <!-- Circle 1: Performance -->
    <g transform="translate(0, 0)">
      <circle cx="50" cy="50" r="42" stroke="#1F2937" stroke-width="8" fill="none"/>
      <circle cx="50" cy="50" r="42" stroke="#10B981" stroke-width="8" fill="none" stroke-dasharray="264" stroke-dashoffset="0"/>
      <text x="50" y="56" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#FFFFFF">100</text>
      <text x="50" y="115" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#10B981">PERFORMANCE</text>
    </g>

    <!-- Circle 2: Accessibility -->
    <g transform="translate(140, 0)">
      <circle cx="50" cy="50" r="42" stroke="#1F2937" stroke-width="8" fill="none"/>
      <circle cx="50" cy="50" r="42" stroke="#10B981" stroke-width="8" fill="none" stroke-dasharray="264" stroke-dashoffset="0"/>
      <text x="50" y="56" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#FFFFFF">100</text>
      <text x="50" y="115" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#10B981">ACCESSIBILITY</text>
    </g>

    <!-- Circle 3: Best Practices -->
    <g transform="translate(280, 0)">
      <circle cx="50" cy="50" r="42" stroke="#1F2937" stroke-width="8" fill="none"/>
      <circle cx="50" cy="50" r="42" stroke="#10B981" stroke-width="8" fill="none" stroke-dasharray="264" stroke-dashoffset="0"/>
      <text x="50" y="56" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#FFFFFF">100</text>
      <text x="50" y="115" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#10B981">BEST PRACTICES</text>
    </g>

    <!-- Circle 4: SEO -->
    <g transform="translate(420, 0)">
      <circle cx="50" cy="50" r="42" stroke="#1F2937" stroke-width="8" fill="none"/>
      <circle cx="50" cy="50" r="42" stroke="#10B981" stroke-width="8" fill="none" stroke-dasharray="264" stroke-dashoffset="0"/>
      <text x="50" y="56" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#FFFFFF">100</text>
      <text x="50" y="115" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#10B981">SEO</text>
    </g>

    <!-- Detailed Metrics Table Below -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="520" height="120" rx="10" fill="#0A1612" stroke="#1F2937" stroke-width="1"/>
      
      <text x="25" y="40" font-family="sans-serif" font-size="12" fill="#A1A1AA">Largest Contentful Paint (LCP)</text>
      <text x="440" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10B981">0.8 s</text>

      <text x="25" y="75" font-family="sans-serif" font-size="12" fill="#A1A1AA">Cumulative Layout Shift (CLS)</text>
      <text x="440" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10B981">0.000</text>

      <text x="25" y="105" font-family="sans-serif" font-size="12" fill="#A1A1AA">Interaction to Next Paint (INP)</text>
      <text x="440" y="105" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10B981">24 ms</text>
    </g>
  </g>
</svg>
