<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#07110D" />
  <radialGradient id="brGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
    <stop offset="100%" stop-color="#050505" stop-opacity="0" />
  </radialGradient>
  <rect width="800" height="500" fill="url(#brGlow)" />
  
  <rect x="80" y="50" width="640" height="400" rx="16" fill="#0B1F17" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Brand Showcase Canvas -->
  <g transform="translate(130, 90)">
    <!-- Primary Logo Plaque -->
    <rect x="0" y="0" width="240" height="200" rx="14" fill="#0E1726" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="120" cy="85" r="45" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="2"/>
    <polygon points="120,55 145,105 95,105" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <text x="120" y="160" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle" fill="#FFFFFF">NEXUS PROTOCOL</text>
    
    <!-- Color Swatches -->
    <g transform="translate(270, 0)">
      <rect x="0" y="0" width="270" height="90" rx="10" fill="#182721" stroke="#1F2937" stroke-width="1"/>
      <rect x="20" y="25" width="40" height="40" rx="8" fill="#10B981"/>
      <rect x="75" y="25" width="40" height="40" rx="8" fill="#38BDF8"/>
      <rect x="130" y="25" width="40" height="40" rx="8" fill="#8B5CF6"/>
      <rect x="185" y="25" width="40" height="40" rx="8" fill="#07110D" stroke="#374151" stroke-width="1"/>
      <text x="20" y="80" font-family="sans-serif" font-size="9" fill="#A1A1AA">Color Harmony System</text>
    </g>

    <!-- Typography Specs -->
    <g transform="translate(270, 105)">
      <rect x="0" y="0" width="270" height="95" rx="10" fill="#182721" stroke="#1F2937" stroke-width="1"/>
      <text x="20" y="35" font-family="sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">Aa Bb Gg 123</text>
      <text x="20" y="65" font-family="sans-serif" font-size="12" fill="#8B5CF6">Geometric Sans Display 800</text>
      <text x="20" y="82" font-family="sans-serif" font-size="11" fill="#A1A1AA">Custom Kerning &amp; Optical Sizing</text>
    </g>

    <!-- Stationery Cards -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="540" height="90" rx="12" fill="#0A1612" stroke="#1F2937" stroke-width="1"/>
      <rect x="20" y="20" width="140" height="50" rx="6" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1"/>
      <text x="35" y="45" font-family="sans-serif" font-size="10" font-weight="bold" fill="#C4B5FD">BUSINESS CARDS</text>
      <rect x="180" y="20" width="160" height="50" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
      <text x="195" y="45" font-family="sans-serif" font-size="10" font-weight="bold" fill="#6EE7B7">SOCIAL KIT VECTORS</text>
      <rect x="360" y="20" width="160" height="50" rx="6" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1"/>
      <text x="375" y="45" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7DD3FC">BRAND GUIDELINES</text>
    </g>
  </g>
</svg>
